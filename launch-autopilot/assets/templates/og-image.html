<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1200x630"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family={{font_head_q}}:wght@600;800&family={{font_body_q}}:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:{{bg}};--fg:{{fg}};--muted:{{muted}};--a:{{accent}};--a2:{{accent2}}}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:"{{font_body}}",system-ui,sans-serif}h1,h2,.head{font-family:"{{font_head}}","{{font_body}}",system-ui,sans-serif;letter-spacing:-.02em}
img[src=""]{display:none}.brand{display:flex;align-items:center;gap:16px;font-weight:600;color:var(--muted)}.brand{font-size:30px}.brand img{height:44px}
.c{width:1200px;height:630px;padding:72px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
h1{font-size:68px;line-height:1.04;font-weight:800}p{font-size:28px;color:var(--muted);margin-top:24px;line-height:1.4}
.shot{width:100%;height:480px;object-fit:cover;object-position:top left;border-radius:20px;border:2px solid #ffffff22}
.brand{margin-top:40px}
</style></head><body><div class="c"><div><h1>{{headline}}</h1><p>{{sub}}</p><div class="brand"><img src="{{logo}}" alt=""> {{url}}</div></div>
<img class="shot" src="{{image}}" alt="{{alt}}"></div></body></html>
