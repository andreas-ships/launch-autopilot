<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family={{font_head_q}}:wght@600;800&family={{font_body_q}}:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:{{bg}};--fg:{{fg}};--muted:{{muted}};--a:{{accent}};--a2:{{accent2}}}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:"{{font_body}}",system-ui,sans-serif}h1,h2,.head{font-family:"{{font_head}}","{{font_body}}",system-ui,sans-serif;letter-spacing:-.02em}
img[src=""]{display:none}.brand{display:flex;align-items:center;gap:16px;font-weight:600;color:var(--muted)}.brand{font-size:30px}.brand img{height:44px}
/* 9:16 safe zone: keep text out of the top 250px and bottom 400px (platform UI) */
.c{width:1080px;height:1920px;padding:260px 90px 420px;display:flex;flex-direction:column;justify-content:center;gap:48px}
.k{font-size:44px;font-weight:600;color:var(--a);opacity:0;animation:in .5s .1s forwards}
h1{font-size:128px;line-height:1;font-weight:800}
h1 span{display:inline-block;opacity:0;transform:translateY(60px);animation:in .45s forwards}
p{font-size:52px;line-height:1.3;color:var(--muted);opacity:0;animation:in .6s .9s forwards}
.u{position:absolute;bottom:430px;left:90px;height:14px;width:0;background:var(--a);border-radius:7px;animation:w .8s 1.1s forwards}
@keyframes in{to{opacity:1;transform:none}}@keyframes w{to{width:420px}}
</style></head><body><div class="c">
<div class="k">{{kicker}}</div><h1 id="h">{{headline}}</h1><p>{{sub}}</p></div><div class="u"></div>
<script>/* word-by-word reveal */const h=document.getElementById('h');h.innerHTML=h.textContent.split(' ').map((w,i)=>'<span style="animation-delay:'+(0.25+i*0.12)+'s">'+w+'</span>').join(' ');</script>
</body></html>
